apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: flowact
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8083"
  DB_URL: "jdbc:postgresql://user-db:5432/flowact_users"
  JWT_ISSUER: "flowact-user-service"
  JWT_ACCESS_TOKEN_TTL_MINUTES: "30"
  JWT_REFRESH_TOKEN_TTL_DAYS: "14"
  BCRYPT_STRENGTH: "12"
  CORS_ALLOWED_ORIGINS: "https://flowact.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
  OPENAPI_ENABLED: "true"
  SWAGGER_UI_ENABLED: "true"
  HEALTH_DETAILS: "always"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_WEB: "INFO"
  LOG_LEVEL_SECURITY: "INFO"
  LOG_LEVEL_SQL: "INFO"
  LOG_LEVEL_BIND: "INFO"
  LOG_LEVEL_APP: "DEBUG"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: flowact
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8082"
  DB_URL: "jdbc:postgresql://execution-db:5432/flowact_execution"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  JWT_ISSUER: "flowact-user-service"
  CORS_ALLOWED_ORIGINS: "https://flowact.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type"
  CORS_ALLOW_CREDENTIALS: "true"
  AUTH_SERVICE_URL: "http://user-service:8083"
  ML_SERVICE_URL: "http://ml-service:8000"
  GATEWAY_SERVICE_URL: "http://frontend"
  SCHEDULE_SERVICE_URL: "http://schedule-service:8084"
  OPENAPI_ENABLED: "true"
  SWAGGER_UI_ENABLED: "true"
  HEALTH_DETAILS: "always"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_WEB: "INFO"
  LOG_LEVEL_SECURITY: "INFO"
  LOG_LEVEL_SQL: "INFO"
  LOG_LEVEL_BIND: "INFO"
  LOG_LEVEL_APP: "DEBUG"
  JPA_SHOW_SQL: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-service-config
  namespace: flowact
data:
  SERVER_PORT: "8081"
  DB_URL: "jdbc:postgresql://execution-db:5432/flowact_execution"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  FLOWACT_ML_BASE_URL: "http://ml-service:8000"
  FLOWACT_LLM_OPENROUTER_BASE_URL: "https://openrouter.ai"
  FLOWACT_LLM_OPENROUTER_DEFAULT_MODEL: "openrouter/free"
  FLOWACT_LLM_OPENROUTER_ALLOW_PAID_MODELS: "false"
  FLOWACT_LLM_OPENROUTER_SITE_URL: ""
  FLOWACT_LLM_OPENROUTER_APP_NAME: "FlowAct"
  FLOWACT_EMAIL_ENABLED: "true"
  FLOWACT_EMAIL_DEFAULT_FROM: "<confirmed sender's address>"
  SPRING_MAIL_HOST: "smtp.mailersend.net"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-service-config
  namespace: flowact
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "flowact.duckdns.org,localhost,127.0.0.1,ml-service,ml-service.flowact,ml-service.flowact.svc,ml-service.flowact.svc.cluster.local"
  DJANGO_CORS_ALLOWED_ORIGINS: "https://flowact.duckdns.org,http://localhost:3000,http://localhost:5173"
  DB_ENGINE: "postgresql"
  DB_NAME: "flowact_ml"
  DB_HOST: "ml-db"
  DB_PORT: "5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: flowact
data:
  EXECUTION_DB_NAME: "flowact_execution"
  USER_DB_NAME: "flowact_users"
  ML_DB_NAME: "flowact_ml"
  POSTGRES_USER: "postgres"
