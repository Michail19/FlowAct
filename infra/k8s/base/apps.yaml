apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: flowact
  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: flowact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: flowact
    spec:
      serviceAccountName: flowact-app
      containers:
        - name: user-service
          image: ghcr.io/michail19/flowact-user-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: flowact-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: flowact
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
