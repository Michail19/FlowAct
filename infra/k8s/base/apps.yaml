apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: flowact
  labels:
    app: ml-service
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: flowact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        app.kubernetes.io/name: ml-service
        app.kubernetes.io/part-of: flowact
    spec:
      serviceAccountName: flowact-app
      containers:
        - name: ml-service
          image: ghcr.io/michail19/flowact-ml-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ml-service-config
            - secretRef:
                name: flowact-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: flowact
spec:
  selector:
    app: ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: flowact
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: flowact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: flowact
    spec:
      serviceAccountName: flowact-app
      containers:
        - name: frontend
          image: ghcr.io/michail19/flowact-frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: flowact
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
