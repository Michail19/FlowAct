apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowact-ingress
  namespace: flowact
spec:
  ingressClassName: nginx
  rules:
    - host: flowact.duckdns.org
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8083

          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8083

          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: execution-service
                port:
                  number: 8082

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowact-ml-ingress
  namespace: flowact
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: flowact.duckdns.org
      http:
        paths:
          - path: /api/ml(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ml-service
                port:
                  number: 8000
