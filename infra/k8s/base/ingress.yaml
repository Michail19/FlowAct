apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowact-ingress
  namespace: flowact
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: flowact.local
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 8083
          - path: /api/execution(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: execution-service
                port:
                  number: 8082
          - path: /api/ml(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ml-service
                port:
                  number: 8000
