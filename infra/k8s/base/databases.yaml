apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: execution-db-data
  namespace: flowact
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-db
  namespace: flowact
  labels:
    app: execution-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-db
  template:
    metadata:
      labels:
        app: execution-db
    spec:
      serviceAccountName: flowact-app
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: EXECUTION_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowact-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: execution-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "flowact_execution"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: execution-db-data
          persistentVolumeClaim:
            claimName: execution-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: execution-db
  namespace: flowact
spec:
  selector:
    app: execution-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
