name: Build and publish Docker images

on:
  push:
    branches:
      - main
      - feature/deployment
    paths:
      - 'UserService/**'
      - 'ExecutionService/**'
      - 'WorkerService/**'
      - 'MLService/**'
      - 'Frontend/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    branches:
      - main
      - feature/deployment
    paths:
      - 'UserService/**'
      - 'ExecutionService/**'
      - 'WorkerService/**'
      - 'MLService/**'
      - 'Frontend/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: ./UserService
            dockerfile: ./UserService/Dockerfile
            image: flowact-user-service
            build_args: ''
          - service: execution-service
            context: ./ExecutionService
            dockerfile: ./ExecutionService/Dockerfile
            image: flowact-execution-service
            build_args: ''
          - service: worker-service
            context: ./WorkerService
            dockerfile: ./WorkerService/Dockerfile
            image: flowact-worker-service
            build_args: ''
          - service: ml-service
            context: ./MLService
            dockerfile: ./MLService/Dockerfile
            image: flowact-ml-service
            build_args: ''
          - service: frontend
            context: ./Frontend
            dockerfile: ./Frontend/Dockerfile
            image: flowact-frontend
            build_args: |
              VITE_API_BASE_URL=/api
              VITE_DEV_AUTH_ENABLED=false
              VITE_ML_SERVICE_BASE_URL=/api/ml
              VITE_DEV_USER_ID=11111111-1111-1111-1111-111111111111
              VITE_DEV_AUTH_TOKEN=dev-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REF_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ env.REF_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
