name: FlowAct CI/CD

on:
  push:
    branches:
      - main
      - review
      - feature/deployment
  pull_request:
    branches:
      - main
      - review
      - feature/deployment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flowact-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: Frontend
        run: npm run typecheck

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare Gradle wrappers
        run: |
          chmod +x UserService/gradlew
          chmod +x ExecutionService/gradlew
          chmod +x WorkerService/gradlew

      - name: Check UserService sources compile
        working-directory: UserService
        run: ./gradlew --no-daemon classes testClasses -x test -x fuzzingTest

      - name: Check ExecutionService sources compile
        working-directory: ExecutionService
        run: ./gradlew --no-daemon classes testClasses -x test

      - name: Check WorkerService sources compile
        working-directory: WorkerService
        run: ./gradlew --no-daemon classes testClasses -x test

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare Gradle wrappers
        run: |
          chmod +x UserService/gradlew
          chmod +x ExecutionService/gradlew
          chmod +x WorkerService/gradlew

      - name: Test UserService without fuzzing tests
        working-directory: UserService
        run: ./gradlew --no-daemon test

      - name: Test ExecutionService
        working-directory: ExecutionService
        run: ./gradlew --no-daemon test

      - name: Test WorkerService
        working-directory: WorkerService
        run: ./gradlew --no-daemon test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            UserService/build/reports/tests/test
            ExecutionService/build/reports/tests/test
            WorkerService/build/reports/tests/test

  fuzzing-tests:
    name: Fuzzing tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare UserService Gradle wrapper
        run: chmod +x UserService/gradlew

      - name: Run UserService fuzzing tests
        working-directory: UserService
        run: ./gradlew --no-daemon fuzzingTest

      - name: Upload fuzzing test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-test-reports
          if-no-files-found: ignore
          path: UserService/build/reports/tests/fuzzingTest

  ci:
    name: Build and compose validation
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - fuzzing-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare Gradle wrappers
        run: |
          chmod +x UserService/gradlew
          chmod +x ExecutionService/gradlew
          chmod +x WorkerService/gradlew

      - name: Build UserService artifact
        working-directory: UserService
        run: ./gradlew --no-daemon build -x test -x fuzzingTest

      - name: Build ExecutionService artifact
        working-directory: ExecutionService
        run: ./gradlew --no-daemon build -x test

      - name: Build WorkerService artifact
        working-directory: WorkerService
        run: ./gradlew --no-daemon build -x test

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Prepare local Caddyfile for Docker build validation
        run: cp Caddyfile.example Caddyfile

      - name: Validate Docker images can be built
        run: docker compose build --pull frontend user-service execution-service worker-service ml-service

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: ignore
          path: |
            Frontend/dist
            UserService/build/libs/*.jar
            ExecutionService/build/libs/*.jar
            WorkerService/build/libs/*.jar

  deploy:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: ./UserService
            dockerfile: ./UserService/Dockerfile
            image: flowact-user-service
            build_args: ""
          - service: execution-service
            context: ./ExecutionService
            dockerfile: ./ExecutionService/Dockerfile
            image: flowact-execution-service
            build_args: ""
          - service: worker-service
            context: ./WorkerService
            dockerfile: ./WorkerService/Dockerfile
            image: flowact-worker-service
            build_args: ""
          - service: ml-service
            context: ./MLService
            dockerfile: ./MLService/Dockerfile
            image: flowact-ml-service
            build_args: ""
          - service: frontend
            context: ./Frontend
            dockerfile: ./Frontend/Dockerfile
            image: flowact-frontend
            build_args: |
              VITE_API_BASE_URL=/api
              VITE_DEV_AUTH_ENABLED=false
              VITE_ML_SERVICE_BASE_URL=/api/ml
              VITE_DEV_USER_ID=11111111-1111-1111-1111-111111111111
              VITE_DEV_AUTH_TOKEN=dev-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REF_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ env.REF_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
