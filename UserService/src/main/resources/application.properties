spring.application.name=UserService

server.port=${SERVER_PORT:8083}

# Active profile can be overridden:
# SPRING_PROFILES_ACTIVE=init
# SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:init}

# ======================
# DATASOURCE
# ======================
# ??? ?????????? ??????? ????? ????????????:
# DB_URL=jdbc:postgresql://localhost:5433/flowact_users
#
# ??? docker-compose, ???? ?? ????? ????????? ???????????:
# DB_URL=jdbc:postgresql://user-db:5432/flowact_users
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================
# JPA
# ======================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ======================
# FLYWAY
# ======================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ======================
# JACKSON
# ======================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ======================
# OPENAPI
# ======================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.default-produces-media-type=application/json

# ======================
# ACTUATOR
# ======================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_DETAILS:always}

# ======================
# LOGGING
# ======================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_BIND:INFO}
logging.level.com.ms.userservice=${LOG_LEVEL_APP:INFO}

# ======================
# SECURITY / JWT
# ======================
flowact.security.jwt.secret=${JWT_SECRET}
flowact.security.jwt.issuer=${JWT_ISSUER:flowact-user-service}
flowact.security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:30}
flowact.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:14}

# BCrypt strength. 10-12 ????????? ??? dev/MVP.
flowact.security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}

# ======================
# CORS
# ======================
flowact.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
flowact.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
flowact.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
flowact.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
