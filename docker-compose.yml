services:
  postgres:
    image: postgres:16-alpine
    container_name: flowact-postgres
    environment:
      POSTGRES_DB: flowact_execution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    expose:
      - "5432"
    volumes:
      - flowact-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowact_execution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowact-network

  user-db:
    image: postgres:16-alpine
    container_name: flowact-user-db
    environment:
      POSTGRES_DB: flowact_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    expose:
      - "5432"
    volumes:
      - flowact-user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowact_users"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowact-network

  ml-db:
    image: postgres:16-alpine
    container_name: flowact-ml-db
    environment:
      POSTGRES_DB: flowact_ml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    expose:
      - "5432"
    volumes:
      - flowact-ml-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowact_ml"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowact-network

  kafka:
    image: apache/kafka:4.1.2
    container_name: flowact-kafka
    ports:
      - "9092:9092"
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - flowact-network

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: flowact-user-service
    environment:
      SPRING_PROFILES_ACTIVE: ${USER_SERVICE_SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://user-db:5432/flowact_users
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-change-this-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-flowact-user-service}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-30}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-14}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OPENAPI_ENABLED: "true"
      SWAGGER_UI_ENABLED: "true"
      HEALTH_DETAILS: always
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_WEB: INFO
      LOG_LEVEL_SECURITY: INFO
      LOG_LEVEL_SQL: INFO
      LOG_LEVEL_BIND: INFO
      LOG_LEVEL_APP: DEBUG
    ports:
      - "8083:8083"
    expose:
      - "8083"
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - flowact-network

  execution-service:
    build:
      context: ./ExecutionService
      dockerfile: Dockerfile
    container_name: flowact-execution-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/flowact_execution
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-change-this-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-flowact-user-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://user-service:8083}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      GATEWAY_SERVICE_URL: ${GATEWAY_SERVICE_URL:-http://frontend}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL:-http://host.docker.internal:8084}
      OPENAPI_ENABLED: "true"
      SWAGGER_UI_ENABLED: "true"
      HEALTH_DETAILS: always
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_WEB: INFO
      LOG_LEVEL_SECURITY: INFO
      LOG_LEVEL_SQL: INFO
      LOG_LEVEL_BIND: INFO
      LOG_LEVEL_APP: DEBUG
      JPA_SHOW_SQL: "false"
    ports:
      - "8082:8082"
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - flowact-network

  worker-service:
    build:
      context: ./WorkerService
      dockerfile: Dockerfile
    container_name: flowact-worker-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/flowact_execution
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      FLOWACT_ML_BASE_URL: ${FLOWACT_ML_BASE_URL:-http://ml-service:8000}
      FLOWACT_LLM_OPENROUTER_BASE_URL: ${FLOWACT_LLM_OPENROUTER_BASE_URL:-https://openrouter.ai}
      FLOWACT_LLM_OPENROUTER_API_KEY: ${FLOWACT_LLM_OPENROUTER_API_KEY:-}
      FLOWACT_LLM_OPENROUTER_DEFAULT_MODEL: ${FLOWACT_LLM_OPENROUTER_DEFAULT_MODEL:-openrouter/free}
      FLOWACT_LLM_OPENROUTER_ALLOW_PAID_MODELS: ${FLOWACT_LLM_OPENROUTER_ALLOW_PAID_MODELS:-false}
      FLOWACT_LLM_OPENROUTER_SITE_URL: ${FLOWACT_LLM_OPENROUTER_SITE_URL:-}
      FLOWACT_LLM_OPENROUTER_APP_NAME: ${FLOWACT_LLM_OPENROUTER_APP_NAME:-FlowAct}
      FLOWACT_EMAIL_ENABLED: ${FLOWACT_EMAIL_ENABLED:-false}
      FLOWACT_EMAIL_DEFAULT_FROM: ${FLOWACT_EMAIL_DEFAULT_FROM:-noreply@flowact.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-false}
    ports:
      - "8081:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      execution-service:
        condition: service_healthy
    networks:
      - flowact-network

  ml-service:
    build:
      context: ./MLService
      dockerfile: Dockerfile
    container_name: flowact-ml-service
    environment:
      DJANGO_SECRET_KEY: ${ML_SERVICE_DJANGO_SECRET_KEY:-change-this-ml-service-secret}
      DJANGO_DEBUG: ${ML_SERVICE_DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${ML_SERVICE_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,ml-service}
      DJANGO_CORS_ALLOWED_ORIGINS: ${ML_SERVICE_DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      DB_ENGINE: postgresql
      DB_NAME: flowact_ml
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: ml-db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
      ml-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/ | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - flowact-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_DEV_AUTH_ENABLED: "false"
        VITE_ML_SERVICE_BASE_URL: ${VITE_ML_SERVICE_BASE_URL:-http://localhost:8000}
        VITE_DEV_USER_ID: "11111111-1111-1111-1111-111111111111"
        VITE_DEV_AUTH_TOKEN: "dev-token"
    container_name: flowact-frontend
    ports:
      - "3000:80"
    expose:
      - "80"
    depends_on:
      execution-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - flowact-network

  caddy:
    image: caddy:2.8-alpine
    container_name: flowact-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - flowact-network

  prometheus:
    image: prom/prometheus:latest
    container_name: flowact-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - user-service
      - execution-service
      - worker-service
    networks:
      - flowact-network

  grafana:
    image: grafana/grafana:latest
    container_name: flowact-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - flowact-network

volumes:
  flowact-postgres-data:
  flowact-user-db-data:
  flowact-ml-db-data:
  caddy_data:
  caddy_config:
  prometheus-data:
  grafana-data:

networks:
  flowact-network:
    driver: bridge
